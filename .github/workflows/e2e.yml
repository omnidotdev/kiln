name: E2E 🚢

# Builds and HTTP-probes a minimal real app per language provider (fixtures under
# crates/kiln-cli/tests/fixtures). Needs Docker + BuildKit, so it runs here
# rather than in the unit-test job. Gated by KILN_E2E so a normal `cargo test`
# skips it.

on:
  push:
    branches: [master]
    paths:
      - "crates/kiln-core/src/providers/**"
      - "crates/kiln-core/src/dockerfile.rs"
      - "crates/kiln-cli/src/**"
      - "crates/kiln-cli/tests/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [master]
    paths:
      - "crates/kiln-core/src/providers/**"
      - "crates/kiln-core/src/dockerfile.rs"
      - "crates/kiln-cli/src/**"
      - "crates/kiln-cli/tests/**"
  workflow_dispatch:

jobs:
  e2e:
    name: Build + serve fixtures 🚢
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: docker/setup-buildx-action@v3
      - name: Run E2E fixtures
        env:
          KILN_E2E: "1"
        run: cargo test --test e2e -- --nocapture
